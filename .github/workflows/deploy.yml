name: Deploy site

# Deploys the static site to the Hetzner server (Caddy serves /var/www/enlightenedbits)
# on every push to main. Can also be run manually from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; if a newer push lands, cancel the in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the server host key (public info) so we don't blindly trust on first connect.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -av --delete --no-owner --no-group \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${{ secrets.DEPLOY_TARGET }}"
